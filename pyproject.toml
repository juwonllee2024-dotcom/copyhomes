[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copyhomes"
version = "0.1.0"
description = "Save one file to multiple explicit local homes with preview and undo"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "juwonllee2024-dotcom" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
  "build==1.6.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "ruff==0.16.5",
  "setuptools==83.0.0",
]

[project.scripts]
copyhomes = "copyhomes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
